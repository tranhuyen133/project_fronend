  <!-- Modal thêm / sửa -->
  <div class="modal" id="subject-modal">
    <div class="modal-content">

        <input type="text" id="subject-name" required>

    </div>

<!-- Modal thêm / sửa -->
<div class="modal" id="subject-modal">
  <div class="modal-content">
    <span class="close" id="close-modal">&times;</span>
    <h3 id="modal-title">Thêm mới môn học</h3>
    <form id="subject-form">
      <label>Tên môn học</label>
      <input type="text" id="subject-name" required>
      <div class="form-group">
        <label>Trạng thái</label>
        <label><input type="radio" name="status" value="active" checked> Đang hoạt động</label>
        <label><input type="radio" name="status" value="inactive"> Ngừng hoạt động</label>
      </div>
      <div class="modal-actions">
        <button type="button" id="cancel-btn">Hủy</button>
        <button type="submit" id="save-btn">Thêm</button>
      </div>
    </form>
  </div>
</div>


<!-- Modal xác nhận xóa -->
<div class="modal" id="confirm-modal">
  <div class="modal-content">
    <p id="confirm-message">Bạn có chắc muốn xóa?</p>
    <div class="modal-actions">
      <button id="confirm-cancel">Hủy</button>
      <button id="confirm-delete" style="background-color: red; color: white;">Xóa</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden">
  <div class="toast-content">
    <span class="toast-icon"><img src="/assets/icons/check_circle.png" alt=""></span>
    <div class="toast-text">
      <strong id="toast-title">Thành công</strong>
      <div id="toast-message">Xử lý thành công</div>
    </div>
    <button class="toast-close" onclick="hideToast()">✕</button>
  </div>
</div>
